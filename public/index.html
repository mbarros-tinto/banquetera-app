<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Grupo Pioneros</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/drqkiohu8/image/upload/q_auto/f_auto/v1776383476/Icono_sin_fondo_wyxgzb.png">
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/drqkiohu8/image/upload/q_auto/f_auto/v1776383476/Icono_sin_fondo_wyxgzb.png">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            color:#333;min-height:100vh;
            background:#1a1a2e url('https://res.cloudinary.com/drqkiohu8/image/upload/q_auto/f_auto/v1776365257/Javiera_y_Felipe-468_jxrjef.jpg') center/cover fixed no-repeat;
        }
        body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,rgba(26,26,46,0.82),rgba(44,62,80,0.78));z-index:0;pointer-events:none}
        .container{max-width:1100px;margin:0 auto;padding:16px;position:relative;z-index:1}

        .header{
            display:flex;align-items:center;gap:14px;margin-bottom:20px;
            color:#fff;
        }
        .header img{height:48px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.3))}
        .header h1{font-size:1.6em;text-shadow:0 1px 3px rgba(0,0,0,.3);margin:0}
        .header p{font-size:.9em;opacity:.85;margin:0}
        .header-text{display:flex;flex-direction:column;gap:2px}

        /* Login */
        .login-box{max-width:380px;margin:60px auto;position:relative;z-index:1}
        .login-box .card{
            background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);
            border-radius:16px;padding:32px 28px;text-align:center;
            box-shadow:0 8px 32px rgba(0,0,0,.3);
        }
        .login-box img{width:160px;margin:0 auto 16px;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3))}
        .login-box h1{font-size:1.5em;color:#2c3e50;margin-bottom:6px}
        .login-box p{color:#666;margin-bottom:20px;font-size:.95em}

        .password-input{
            width:100%;padding:12px;font-size:1em;
            border:1px solid #ddd;border-radius:8px;
            margin-bottom:12px;text-align:center;
        }
        .password-input:focus{outline:none;border-color:#3498db;box-shadow:0 0 0 2px rgba(52,152,219,.15)}

        .btn{
            padding:11px 22px;border:none;border-radius:8px;cursor:pointer;
            font-size:.95em;font-weight:500;transition:all .2s;
        }
        .btn-primary{background:#3498db;color:#fff;width:100%}
        .btn-primary:hover{background:#2980b9;transform:translateY(-1px)}
        .btn-danger{background:#e74c3c;color:#fff}
        .btn-danger:hover{background:#c0392b}

        .error-message{color:#e74c3c;margin-top:8px;display:none;font-size:.9em}

        /* Dashboard */
        .dashboard-content{display:none}
        .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
        .top-bar .header{margin-bottom:0}

        .sections-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
            gap:16px;
        }

        .section-card{
            background:rgba(255,255,255,0.95);backdrop-filter:blur(4px);
            border-radius:14px;padding:26px 18px 22px;
            text-align:center;cursor:pointer;
            transition:transform .2s, box-shadow .2s, border-color .2s;
            box-shadow:0 4px 16px rgba(0,0,0,.18);
            border:1px solid rgba(255,255,255,0.6);
            position:relative;overflow:hidden;
        }
        .section-card::before{
            content:'';position:absolute;top:0;left:0;right:0;height:3px;
            background:linear-gradient(90deg,#c89b3c,#e6c068,#c89b3c);
            opacity:.85;
        }
        .section-card:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 28px rgba(0,0,0,.32);
            border-color:#c89b3c;
        }

        .section-icon{
            font-size:2em;margin:0 auto 14px;display:flex;
            align-items:center;justify-content:center;
            width:64px;height:64px;border-radius:50%;
            background:linear-gradient(135deg,rgba(200,155,60,0.15),rgba(230,192,104,0.08));
            border:1px solid rgba(200,155,60,0.25);
        }
        .section-title{font-size:1.05em;font-weight:600;color:#2c3e50;margin-bottom:6px;line-height:1.3}
        .section-description{color:#6c757d;font-size:.85em;line-height:1.45}

        /* Password Modal */
        .password-modal{
            display:none;position:fixed;top:0;left:0;
            width:100%;height:100%;background:rgba(0,0,0,0.6);
            z-index:3000;align-items:center;justify-content:center;
            padding:20px;
        }
        .password-modal.active{display:flex}
        .password-content{
            background:#fff;border-radius:14px;padding:28px;
            max-width:380px;width:100%;text-align:center;
            box-shadow:0 8px 32px rgba(0,0,0,.3);
        }
        .password-content h3{margin-bottom:10px;color:#2c3e50}
        .password-content p{margin-bottom:14px;color:#666;font-size:.9em}
        .password-btn-row{display:flex;gap:8px;margin-top:8px}
        .password-btn-row .btn{flex:1;width:auto}

        /* Mobile */
        @media(max-width:600px){
            .container{padding:10px}
            .header h1{font-size:1.3em}
            .header img{height:40px}
            .sections-grid{grid-template-columns:1fr;gap:12px}
            .section-card{padding:20px 16px}
            .section-icon{font-size:2.2em}
            .password-content{padding:20px}
            .login-box{margin:30px auto}
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Dashboard -->
        <div id="dashboardMain" class="dashboard-content" style="display:block">
            <div class="top-bar">
                <div class="header">
                    <img src="https://res.cloudinary.com/drqkiohu8/image/upload/q_auto/f_auto/v1765987524/Logo_Blanco_y_dorado_png_mbekud.png" alt="Grupo Pioneros">
                    <div class="header-text">
                        <h1>Dashboard Grupo Pioneros</h1>
                        <p>Sistema de gestión integral</p>
                    </div>
                </div>
            </div>
            <div class="sections-grid">
                <div class="section-card fotos" onclick="openPhotosLink()">
                    <span class="section-icon">📸</span>
                    <h3 class="section-title">Bono Fotos</h3>
                    <p class="section-description">Subir fotos para gestión de bonos del equipo</p>
                </div>

                <div class="section-card gestion" onclick="openGestionLink()">
                    <span class="section-icon">📊</span>
                    <h3 class="section-title">Control de Gestión</h3>
                    <p class="section-description">Sistema de control y seguimiento de operaciones</p>
                </div>

                <div class="section-card inscripcion" onclick="openInscripcionLink()">
                    <span class="section-icon">📝</span>
                    <h3 class="section-title">Inscripción datos de pago Trabajador/Proveedor</h3>
                    <p class="section-description">Formulario para registro de datos de pago</p>
                </div>
            </div>
        </div>
    </div>
    <script>
        function openPhotosLink() {
            window.open('https://script.google.com/macros/s/AKfycbxvmJwrz1F6aq9k8353xMNh2EMfgpU8PXAh7aeeDfV1LDeo75Wb8JP32tbZIWV47_YY/exec', '_blank');
        }

        function openGestionLink() {
            // CG 2.0 (2026-08-07): los formularios viven en controlgestion (D1 directo)
            window.open('https://controlgestion.tintobanqueteria.cl/formularios', '_blank');
        }

        function openInscripcionLink() {
            window.open('https://inscripcion.tintobanqueteria.cl/', '_blank');
        }
    </script>
</body>
</html>
