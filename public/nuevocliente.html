<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Nuevo Cliente · Tinto Banquetería</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/drqkiohu8/image/upload/q_auto/f_auto/v1776383476/Icono_sin_fondo_wyxgzb.png">
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/drqkiohu8/image/upload/q_auto/f_auto/v1776383476/Icono_sin_fondo_wyxgzb.png">
    <!-- Formulario jubilado el 08-10-2026 (Manuel: «nadie usa el form antiguo de cliente nuevo,
         jubílalo»). Los leads se ingresan desde el CRM, que los deja en su base (D1) junto con la
         cotización y los seguimientos. Esta página ya no le habla al backend nuevocliente. -->
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            color:#333;min-height:100vh;
            background:#1a1a2e url('https://res.cloudinary.com/drqkiohu8/image/upload/q_auto/f_auto/v1776365257/Javiera_y_Felipe-468_jxrjef.jpg') center/cover fixed;
        }
        body::before{content:'';position:fixed;inset:0;background:linear-gradient(135deg,rgba(26,26,46,0.82),rgba(44,62,80,0.78));z-index:0}
        .container{max-width:560px;margin:0 auto;padding:48px 16px;position:relative;z-index:1}
        .header{display:flex;align-items:center;gap:14px;margin-bottom:20px;color:#fff}
        .header img{height:48px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.3))}
        .header h1{font-size:1.55em;text-shadow:0 1px 3px rgba(0,0,0,.3);line-height:1.2}
        .header p{font-size:.88em;opacity:.85}
        .card{
            background:rgba(255,255,255,0.96);border-radius:16px;padding:28px 26px;
            box-shadow:0 8px 32px rgba(0,0,0,.3);position:relative;overflow:hidden;
        }
        .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#c89b3c,#e6c068,#c89b3c)}
        .card p{line-height:1.6;margin-bottom:14px}
        .ruta{font-weight:600;color:#1a1a2e}
        .boton{display:inline-block;margin-top:6px;padding:12px 22px;border-radius:10px;background:#b8862a;color:#fff;
            text-decoration:none;font-weight:600}
        .boton:hover{background:#9c7022}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="https://res.cloudinary.com/drqkiohu8/image/upload/q_auto/f_auto/v1765987524/Logo_Blanco_y_dorado_png_mbekud.png" alt="Tinto Banquetería">
            <div>
                <h1>Nuevo Cliente</h1>
                <p>Ahora se ingresa desde el CRM</p>
            </div>
        </div>
        <div class="card">
            <p>Este formulario ya no se usa. Los clientes nuevos se ingresan desde el CRM, en
                <span class="ruta">Tinto → Clientes Potenciales → «＋ Nuevo Cliente»</span>.</p>
            <p>Ahí el lead queda registrado con su cotización y sus seguimientos, y el correo sale igual que antes.</p>
            <a class="boton" href="https://crm.tintobanqueteria.cl/">Ir al CRM</a>
        </div>
    </div>
</body>
</html>
